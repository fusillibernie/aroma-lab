[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aroma-lab"
version = "0.1.0"
description = "Fragrance formulator using GC-MS data and aromachemical matching"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "httpx>=0.26.0",
    "python-multipart>=0.0.9",
    "pandas>=2.0.0",
    "pubchempy>=1.0.4",
    "defusedxml>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.100.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
chemistry = [
    "rdkit>=2023.3.1",
]

[project.scripts]
aroma-lab = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
