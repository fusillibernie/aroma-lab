<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aroma Lab - Fragrance Formulation</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e8e8e8;
            min-height: 100vh;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 0; border-bottom: 1px solid #333;
        }
        h1 { font-size: 2rem; color: #f0a500; }
        .tabs {
            display: flex; gap: 10px; margin: 20px 0;
        }
        .tab {
            padding: 12px 24px; background: #2a2a4a; border: none;
            color: #aaa; cursor: pointer; border-radius: 8px 8px 0 0;
            font-size: 1rem; transition: all 0.3s;
        }
        .tab:hover { background: #3a3a5a; color: #fff; }
        .tab.active { background: #f0a500; color: #1a1a2e; }
        .panel { display: none; background: #252540; border-radius: 0 8px 8px 8px; padding: 20px; }
        .panel.active { display: block; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card {
            background: #1e1e38; border-radius: 12px; padding: 20px;
            border: 1px solid #333;
        }
        .card h3 { color: #f0a500; margin-bottom: 15px; }
        input, select, textarea {
            width: 100%; padding: 10px; border-radius: 6px;
            border: 1px solid #444; background: #2a2a4a;
            color: #fff; margin-bottom: 10px;
        }
        input:focus, select:focus { border-color: #f0a500; outline: none; }
        button {
            padding: 10px 20px; background: #f0a500; color: #1a1a2e;
            border: none; border-radius: 6px; cursor: pointer;
            font-weight: bold; transition: all 0.3s;
        }
        button:hover { background: #ffb733; transform: translateY(-2px); }
        .chemical-list {
            max-height: 400px; overflow-y: auto;
        }
        .chemical-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px; border-bottom: 1px solid #333;
            transition: background 0.2s;
        }
        .chemical-item:hover { background: #2a2a4a; }
        .chemical-name { font-weight: bold; color: #fff; }
        .chemical-odor { font-size: 0.85rem; color: #888; margin-top: 4px; }
        .volatility-badge {
            padding: 4px 8px; border-radius: 12px; font-size: 0.75rem;
            text-transform: uppercase;
        }
        .volatility-top { background: #ff6b6b; color: #fff; }
        .volatility-heart { background: #4ecdc4; color: #fff; }
        .volatility-base { background: #9b59b6; color: #fff; }
        .formula-ingredients { margin-top: 15px; }
        .ingredient-row {
            display: flex; gap: 10px; align-items: center;
            padding: 8px; background: #2a2a4a; border-radius: 6px;
            margin-bottom: 8px;
        }
        .ingredient-row input { width: 80px; margin: 0; }
        .ingredient-name { flex: 1; }
        .remove-btn { background: #e74c3c; padding: 5px 10px; }
        .pyramid-container { display: flex; flex-direction: column; align-items: center; }
        .pyramid-level {
            padding: 15px; text-align: center; margin: 5px 0;
            border-radius: 8px;
        }
        .pyramid-top { width: 60%; background: rgba(255, 107, 107, 0.3); border: 2px solid #ff6b6b; }
        .pyramid-heart { width: 75%; background: rgba(78, 205, 196, 0.3); border: 2px solid #4ecdc4; }
        .pyramid-base { width: 90%; background: rgba(155, 89, 182, 0.3); border: 2px solid #9b59b6; }
        .upload-zone {
            border: 2px dashed #444; border-radius: 12px;
            padding: 40px; text-align: center; cursor: pointer;
            transition: all 0.3s;
        }
        .upload-zone:hover { border-color: #f0a500; background: rgba(240, 165, 0, 0.1); }
        .chromatogram { margin-top: 20px; }
        #chart { width: 100%; height: 300px; }
        .search-filters { display: flex; gap: 10px; margin-bottom: 15px; }
        .search-filters input, .search-filters select { width: auto; flex: 1; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Aroma Lab</h1>
            <span>Fragrance Formulation Studio</span>
        </header>

        <div class="tabs">
            <button class="tab active" onclick="showPanel('database')">Chemical Database</button>
            <button class="tab" onclick="showPanel('formulator')">Formula Builder</button>
            <button class="tab" onclick="showPanel('gcms')">GC-MS Analysis</button>
            <button class="tab" onclick="showPanel('compare')">Compare</button>
        </div>

        <!-- Database Panel -->
        <div id="database" class="panel active">
            <div class="card">
                <h3>Aromachemical Database</h3>
                <div class="search-filters">
                    <input type="text" id="search" placeholder="Search chemicals..." oninput="filterChemicals()">
                    <select id="familyFilter" onchange="filterChemicals()">
                        <option value="">All Families</option>
                    </select>
                    <select id="volatilityFilter" onchange="filterChemicals()">
                        <option value="">All Notes</option>
                        <option value="top">Top Notes</option>
                        <option value="heart">Heart Notes</option>
                        <option value="base">Base Notes</option>
                    </select>
                </div>
                <div class="chemical-list" id="chemicalList"></div>
            </div>
        </div>

        <!-- Formula Builder Panel -->
        <div id="formulator" class="panel">
            <div class="grid">
                <div class="card">
                    <h3>Create Formula</h3>
                    <input type="text" id="formulaName" placeholder="Formula Name">
                    <textarea id="formulaDescription" placeholder="Description" rows="3"></textarea>

                    <h4 style="margin: 15px 0 10px;">Add Ingredient</h4>
                    <select id="ingredientSelect">
                        <option value="">Select aromachemical...</option>
                    </select>
                    <div style="display: flex; gap: 10px;">
                        <input type="number" id="ingredientPercent" placeholder="%" step="0.1" min="0" max="100" style="width: 100px;">
                        <button onclick="addIngredient()">Add</button>
                    </div>

                    <div class="formula-ingredients" id="formulaIngredients">
                        <h4>Ingredients</h4>
                        <div id="ingredientsList"></div>
                        <div style="margin-top: 15px; text-align: right;">
                            <strong>Total: <span id="totalPercent">0</span>%</strong>
                        </div>
                    </div>

                    <div style="margin-top: 20px; display: flex; gap: 10px;">
                        <button onclick="saveFormula()">Save Formula</button>
                        <button onclick="exportFormula()" style="background: #3498db;">Export CSV</button>
                    </div>
                </div>

                <div class="card">
                    <h3>Odor Pyramid</h3>
                    <div class="pyramid-container" id="pyramid">
                        <div class="pyramid-level pyramid-top">
                            <strong>Top Notes</strong>
                            <div id="pyramidTop"></div>
                        </div>
                        <div class="pyramid-level pyramid-heart">
                            <strong>Heart Notes</strong>
                            <div id="pyramidHeart"></div>
                        </div>
                        <div class="pyramid-level pyramid-base">
                            <strong>Base Notes</strong>
                            <div id="pyramidBase"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- GC-MS Panel -->
        <div id="gcms" class="panel">
            <div class="card">
                <h3>GC-MS Data Analysis</h3>
                <div class="upload-zone" id="uploadZone" onclick="document.getElementById('gcmsFile').click()">
                    <input type="file" id="gcmsFile" accept=".csv,.txt" style="display: none;" onchange="uploadGCMS(this)">
                    <p>Click or drag to upload GC-MS data file</p>
                    <p style="color: #666; font-size: 0.9rem;">Supports CSV format</p>
                </div>
                <div class="chromatogram">
                    <div id="chart"></div>
                </div>
                <div id="peakTable" style="margin-top: 20px;"></div>
            </div>
        </div>

        <!-- Compare Panel -->
        <div id="compare" class="panel">
            <div class="grid">
                <div class="card">
                    <h3>Natural Reference</h3>
                    <select id="naturalSelect">
                        <option value="">Select natural material...</option>
                        <option value="rose">Rose Otto</option>
                        <option value="jasmine">Jasmine Absolute</option>
                        <option value="sandalwood">Sandalwood</option>
                        <option value="vetiver">Vetiver</option>
                    </select>
                    <div id="naturalComposition"></div>
                </div>
                <div class="card">
                    <h3>Your Recreation</h3>
                    <select id="formulaSelect">
                        <option value="">Select your formula...</option>
                    </select>
                    <div id="recreationComposition"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let chemicals = [];
        let currentFormula = { name: '', description: '', ingredients: [] };

        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            await loadChemicals();
            await loadFamilies();
        });

        function showPanel(panelId) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(panelId).classList.add('active');
            event.target.classList.add('active');
        }

        async function loadChemicals() {
            try {
                const res = await fetch('/api/aromachemicals');
                const data = await res.json();
                chemicals = data.chemicals;
                renderChemicals(chemicals);
                populateIngredientSelect();
            } catch (err) {
                console.error('Error loading chemicals:', err);
            }
        }

        async function loadFamilies() {
            try {
                const res = await fetch('/api/odor-families');
                const data = await res.json();
                const select = document.getElementById('familyFilter');
                data.families.forEach(f => {
                    const opt = document.createElement('option');
                    opt.value = f;
                    opt.textContent = f.charAt(0).toUpperCase() + f.slice(1);
                    select.appendChild(opt);
                });
            } catch (err) {
                console.error('Error loading families:', err);
            }
        }

        function renderChemicals(chems) {
            const list = document.getElementById('chemicalList');
            list.innerHTML = chems.map(c => `
                <div class="chemical-item" onclick="selectChemical('${c.cas_number}')">
                    <div>
                        <div class="chemical-name">${c.name}</div>
                        <div class="chemical-odor">${c.odor_description || ''}</div>
                    </div>
                    <span class="volatility-badge volatility-${c.volatility || 'heart'}">${c.volatility || 'heart'}</span>
                </div>
            `).join('');
        }

        function filterChemicals() {
            const search = document.getElementById('search').value.toLowerCase();
            const family = document.getElementById('familyFilter').value;
            const volatility = document.getElementById('volatilityFilter').value;

            let filtered = chemicals;
            if (search) {
                filtered = filtered.filter(c =>
                    c.name.toLowerCase().includes(search) ||
                    (c.odor_description || '').toLowerCase().includes(search)
                );
            }
            if (family) {
                filtered = filtered.filter(c => (c.odor_families || []).includes(family));
            }
            if (volatility) {
                filtered = filtered.filter(c => c.volatility === volatility);
            }
            renderChemicals(filtered);
        }

        function populateIngredientSelect() {
            const select = document.getElementById('ingredientSelect');
            select.innerHTML = '<option value="">Select aromachemical...</option>';
            chemicals.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.cas_number;
                opt.textContent = `${c.name} (${c.volatility || 'heart'})`;
                select.appendChild(opt);
            });
        }

        function selectChemical(cas) {
            showPanel('formulator');
            document.getElementById('ingredientSelect').value = cas;
        }

        function addIngredient() {
            const cas = document.getElementById('ingredientSelect').value;
            const percent = parseFloat(document.getElementById('ingredientPercent').value);

            if (!cas || !percent) return alert('Select chemical and enter percentage');

            const chem = chemicals.find(c => c.cas_number === cas);
            if (!chem) return;

            currentFormula.ingredients.push({
                cas_number: cas,
                name: chem.name,
                percentage: percent,
                volatility: chem.volatility || 'heart'
            });

            renderIngredients();
            updatePyramid();
            document.getElementById('ingredientPercent').value = '';
        }

        function removeIngredient(index) {
            currentFormula.ingredients.splice(index, 1);
            renderIngredients();
            updatePyramid();
        }

        function renderIngredients() {
            const list = document.getElementById('ingredientsList');
            list.innerHTML = currentFormula.ingredients.map((ing, i) => `
                <div class="ingredient-row">
                    <span class="ingredient-name">${ing.name}</span>
                    <input type="number" value="${ing.percentage}"
                           onchange="updateIngredientPercent(${i}, this.value)" step="0.1">
                    <span>%</span>
                    <button class="remove-btn" onclick="removeIngredient(${i})">X</button>
                </div>
            `).join('');

            const total = currentFormula.ingredients.reduce((sum, ing) => sum + ing.percentage, 0);
            document.getElementById('totalPercent').textContent = total.toFixed(1);
        }

        function updateIngredientPercent(index, value) {
            currentFormula.ingredients[index].percentage = parseFloat(value);
            renderIngredients();
            updatePyramid();
        }

        function updatePyramid() {
            const top = currentFormula.ingredients.filter(i => i.volatility === 'top');
            const heart = currentFormula.ingredients.filter(i => i.volatility === 'heart');
            const base = currentFormula.ingredients.filter(i => i.volatility === 'base');

            document.getElementById('pyramidTop').innerHTML = top.map(i => `<div>${i.name} ${i.percentage}%</div>`).join('');
            document.getElementById('pyramidHeart').innerHTML = heart.map(i => `<div>${i.name} ${i.percentage}%</div>`).join('');
            document.getElementById('pyramidBase').innerHTML = base.map(i => `<div>${i.name} ${i.percentage}%</div>`).join('');
        }

        async function saveFormula() {
            currentFormula.name = document.getElementById('formulaName').value;
            currentFormula.description = document.getElementById('formulaDescription').value;

            if (!currentFormula.name) return alert('Enter formula name');

            try {
                const res = await fetch('/api/formulas', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(currentFormula)
                });
                const data = await res.json();
                alert(`Formula saved! ID: ${data.id}`);
            } catch (err) {
                console.error('Error saving formula:', err);
            }
        }

        function exportFormula() {
            if (!currentFormula.ingredients.length) return alert('No ingredients to export');

            let csv = 'Name,CAS Number,Percentage,Volatility\n';
            currentFormula.ingredients.forEach(ing => {
                csv += `"${ing.name}","${ing.cas_number}",${ing.percentage},${ing.volatility}\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${currentFormula.name || 'formula'}.csv`;
            a.click();
        }

        async function uploadGCMS(input) {
            const file = input.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);

            try {
                const res = await fetch('/api/upload/gcms', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                renderChromatogram(data.peaks);
                renderPeakTable(data.peaks);
            } catch (err) {
                console.error('Error uploading GC-MS:', err);
            }
        }

        function renderChromatogram(peaks) {
            if (!peaks || !peaks.length) return;

            const trace = {
                x: peaks.map(p => p.retention_time),
                y: peaks.map(p => p.area),
                type: 'scatter',
                mode: 'lines',
                fill: 'tozeroy',
                line: { color: '#f0a500' }
            };

            const layout = {
                title: 'Chromatogram',
                xaxis: { title: 'Retention Time (min)' },
                yaxis: { title: 'Intensity' },
                paper_bgcolor: 'rgba(0,0,0,0)',
                plot_bgcolor: 'rgba(0,0,0,0)',
                font: { color: '#e8e8e8' }
            };

            Plotly.newPlot('chart', [trace], layout);
        }

        function renderPeakTable(peaks) {
            if (!peaks || !peaks.length) return;

            const table = document.getElementById('peakTable');
            table.innerHTML = `
                <table style="width: 100%; border-collapse: collapse;">
                    <thead>
                        <tr style="border-bottom: 2px solid #444;">
                            <th style="padding: 10px; text-align: left;">RT (min)</th>
                            <th style="padding: 10px; text-align: left;">Area</th>
                            <th style="padding: 10px; text-align: left;">Compound</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${peaks.map(p => `
                            <tr style="border-bottom: 1px solid #333;">
                                <td style="padding: 8px;">${p.retention_time.toFixed(2)}</td>
                                <td style="padding: 8px;">${p.area.toLocaleString()}</td>
                                <td style="padding: 8px;">${p.compound || '-'}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }
    </script>
</body>
</html>
